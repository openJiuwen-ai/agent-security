[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-windows-process-guard"
version = "0.1.0"
description = "Windows process guard binaries for agent-security. Same version as the core package."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["agent-security==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_security_windows_process_guard = ["bin/win_amd64/*"]
