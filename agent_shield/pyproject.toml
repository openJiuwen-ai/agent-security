[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-shield"
version = "0.1.0"
description = "Agent security components: tool permission decision and content detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Optional shell parser backend; without it the conservative fallback scanner is used.
    "tree-sitter>=0.25.0,<0.26.0",
    "tree-sitter-bash>=0.25.0,<0.26.0",
]

[tool.setuptools]
# Flat layout: this directory is itself the agent_shield package.
license-files = ["LICENSE"]
package-dir = {"agent_shield" = "."}
packages = [
    "agent_shield",
    "agent_shield.detection",
    "agent_shield.tool_permission",
    "agent_shield.tool_permission.fileguard",
    "agent_shield.tool_permission.hostguard",
    "agent_shield.tool_permission.netguard",
    "agent_shield.tool_permission.toolguard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "slow: Slow running tests",
    "async: Async tests",
]

[tool.ruff]
src = [".."]
line-length = 100
