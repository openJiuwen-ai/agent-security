# Runtime compatibility profile; does not change legacy SDK defaults.
sensitive_paths:
- id: home_ssh
  path: ~/.ssh/**
  match: glob
  severity: CRITICAL
  action: deny
- id: any_ssh
  path: '**/.ssh/**'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_env
  path: '**/.env'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_env_ext
  path: '**/.env.*'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_id_rsa
  path: '**/id_rsa'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_id_rsa_ext
  path: '**/id_rsa.*'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_id_ed25519
  path: '**/id_ed25519'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_id_ed25519_ext
  path: '**/id_ed25519.*'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_key_pem
  path: '**/*key*.pem'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_private_pem
  path: '**/*private*.pem'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_pfx
  path: '**/*.pfx'
  match: glob
  severity: CRITICAL
  action: deny
- id: any_key
  path: '**/*.key'
  match: glob
  severity: CRITICAL
  action: deny
- id: home_aws
  path: ~/.aws/**
  match: glob
  severity: HIGH
  action: ask
- id: home_gnupg
  path: ~/.gnupg/**
  match: glob
  severity: HIGH
  action: ask
- id: home_kube
  path: ~/.kube/**
  match: glob
  severity: HIGH
  action: ask
- id: home_docker_config
  path: ~/.docker/config.json
  match: glob
  severity: HIGH
  action: ask
- id: home_netrc
  path: ~/.netrc
  match: glob
  severity: HIGH
  action: ask
- id: home_npmrc
  path: ~/.npmrc
  match: glob
  severity: HIGH
  action: ask
- id: home_gcloud
  path: ~/.config/gcloud/**
  match: glob
  severity: HIGH
  action: ask
windows_sensitive_paths:
- id: home_git_credentials
  path: ~/.git-credentials
  match: glob
  severity: CRITICAL
  action: deny
- id: home_pypirc
  path: ~/.pypirc
  match: glob
  severity: HIGH
  action: ask
- id: home_azure
  path: ~/.azure
  match: prefix
  severity: HIGH
  action: ask
- id: home_gh_hosts
  path: ~/.config/gh/hosts.yml
  match: glob
  severity: HIGH
  action: ask
- id: dpapi_keys
  path: '%APPDATA%/Microsoft/Protect'
  match: prefix
  severity: CRITICAL
  action: deny
- id: roaming_credentials
  path: '%APPDATA%/Microsoft/Credentials'
  match: prefix
  severity: CRITICAL
  action: deny
- id: local_credentials
  path: '%LOCALAPPDATA%/Microsoft/Credentials'
  match: prefix
  severity: CRITICAL
  action: deny
- id: chromium_login_data
  path: '%LOCALAPPDATA%/**/User Data/*/Login Data'
  match: glob
  severity: CRITICAL
  action: deny
- id: chromium_local_state
  path: '%LOCALAPPDATA%/**/User Data/Local State'
  match: glob
  severity: CRITICAL
  action: deny
- id: gh_hosts
  path: '%APPDATA%/GitHub CLI/hosts.yml'
  match: glob
  severity: HIGH
  action: ask
net_urls:
  169.254.169.254: deny
  fd00:ec2::254: deny
  100.100.100.200: deny
  metadata.google.internal: deny
  localhost: allow
  127.0.0.1: allow
