[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypershell"
version = "0.1.0.dev0"
description = "Enterprise agent workspace and permission governance for openJiuwen"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "HyperShell contributors" }]
keywords = ["agent", "sandbox", "permissions", "isolation", "jiuwen", "workspace"]
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.urls]
Homepage = "https://github.com/openJiuwen-ai/agent-security"
Source = "https://github.com/openJiuwen-ai/agent-security/tree/develop/management/hypershell"
Issues = "https://github.com/openJiuwen-ai/agent-security/issues"

[project.scripts]
hypershell = "hypershell.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "httpx>=0.27,<1"]
web = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "jinja2>=3.1,<4",
    "itsdangerous>=2.1,<3",
    "python-multipart>=0.0.9,<1",
    "argon2-cffi>=23.1,<26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["hypershell*"]

[tool.setuptools.package-data]
"hypershell.web" = ["templates/*.html"]

# --- 静态检查/格式化配置（与仓库其它组件对齐，便于 CI 与本地一致） ---
[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E203: 与 black 的切片空格风格兼容
extend-ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pylint.MAIN]
py-version = "3.11"

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pylint.DESIGN]
max-return = 6
max-args = 12
max-locals = 20
max-branches = 30
