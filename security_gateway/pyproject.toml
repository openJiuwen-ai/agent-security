[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-gateway"
version = "0.1.0"
description = "A Python secure store and credential router"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "cryptography>=43",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools]
# ``src`` is the package named ``security_gateway``; its children are the
# subpackages.  A ``find`` directive would treat those children as top-level
# packages (``vault``, ``crypto``) and break the import path, so the list is
# explicit on purpose.  It must name every directory under ``src`` that has an
# ``__init__.py``.
package-dir = { security_gateway = "src" }
packages = [
    "security_gateway",
    "security_gateway.crypto",
    "security_gateway.platform",
    "security_gateway.vault",
    "security_gateway.vault.clusterdek",
    "security_gateway.vault.clusterkey",
    "security_gateway.vault.etcdstore",
    "security_gateway.vault.sync",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: exercises real processes, real etcd, or multi-second failure recovery",
    "load: multi-process or multi-node load test",
]

[tool.ruff]
src = ["src"]
line-length = 120
