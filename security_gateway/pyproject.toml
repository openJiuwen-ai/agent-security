[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-gateway"
version = "0.1.0"
description = "A Python secure store and credential router"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "cryptography>=43",
    "PyYAML>=6",
]

[project.optional-dependencies]
etcd = [
    "etcd3>=0.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { security_gateway = "src" }
packages = [
    "security_gateway",
    "security_gateway.crypto",
    "security_gateway.platform",
    "security_gateway.vault",
    "security_gateway.credmgr",
    "security_gateway.credmgr.etcdstore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 120
