# The installable unit of this repository.
#
# The package lives in this directory (``cred_router/``), so this is the
# directory a consumer points at:
#
#     pip install "cred-router-python @ git+ssh://git@host/repo.git#subdirectory=src"
#
# The repository root holds the development configuration (pytest, and
# whatever else the repo configures); the package's own metadata is here,
# so there is exactly one copy of it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cred-router-python"
version = "0.1.0"
description = "Python implementation of cred_router: a generic secure store and credential router"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "cryptography>=43",
    "PyYAML>=6",
]

[project.optional-dependencies]
litellm = ["litellm"]
admin = ["fastapi>=0.110", "uvicorn>=0.27"]
proxy = ["httpx>=0.27"]
etcd = ["etcd3>=0.12"]

[project.scripts]
cred-router = "cred_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
